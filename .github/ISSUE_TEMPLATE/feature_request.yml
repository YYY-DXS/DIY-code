name: 💡 功能建议
description: 想要的新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说清「谁、在什么场景、遇到什么问题」，比直接给方案更有用。

  - type: dropdown
    id: product
    attributes:
      label: 相关软件 / 插件
      options:
        - pc-toolkit
        - desktop-widget
        - tech-pulse
        - codex-portable
        - raw-to-jpg
        - lumen-translate
        - hanhua-kit
        - dsh-plugin-pulse
        - updater
        - deepseek-hub（插件）
        - media-studio（插件）
        - query-bridge（插件）
        - codex-history-bridge（插件）
        - 新工具 / 不确定

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题或场景
      description: 现在是怎么做的？哪一步最费时间？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的做法

  - type: textarea
    id: alternatives
    attributes:
      label: 试过的替代办法
      description: 其他软件怎么解决的？为什么不行？

  - type: checkboxes
    id: help
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个功能
