name: Build binaries

# 代码签名（SignPath）要求：产物必须由 CI 从源码可验证地构建，并带产品名/版本元数据。
# 本 workflow 只负责「构建 + 上传 artifact」，不参与发布流程，不会影响现有的 release。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python --version
          python -m pip install --upgrade pip pyinstaller
          python -c "import PyInstaller; print('PyInstaller', PyInstaller.__version__)"

      # 预检：把「脚本语法错误 / 文件缺失 / 环境差异」和「编译失败」分开，失败时一眼能看出是哪类
      - name: Preflight
        shell: pwsh
        run: |
          "pwsh $($PSVersionTable.PSVersion)"
          python --version
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          "csc exists: $(Test-Path $csc)"
          "WPF WindowsBase: $(Test-Path 'C:\Windows\Microsoft.NET\assembly\GAC_MSIL\WindowsBase\v4.0_4.0.0.0__31bf3856ad364e35\WindowsBase.dll')"
          "WPF PresentationCore: $(Test-Path 'C:\Windows\Microsoft.NET\assembly\GAC_64\PresentationCore\v4.0_4.0.0.0__31bf3856ad364e35\PresentationCore.dll')"
          Get-ChildItem tools/build | Format-Table Name, Length -AutoSize | Out-String | Write-Host
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/build/build-binaries.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Host "::error title=脚本语法错误::$($_.Message)（第 $($_.Extent.StartLineNumber) 行）"
            }
            throw "构建脚本有语法错误，详见上方 annotation"
          }
          "parse ok"

      - name: Build DeepSeekHubPanel.exe
        shell: pwsh
        run: |
          try { ./tools/build/build-binaries.ps1 -Only launcher }
          catch {
            Write-Host "::error title=launcher 构建失败::$(($_.Exception.Message -replace "`r?`n", " | "))"
            throw
          }

      - name: Build RAW转JPG.exe
        shell: pwsh
        run: |
          try { ./tools/build/build-binaries.ps1 -Only raw }
          catch {
            Write-Host "::error title=RAW转JPG 构建失败::$(($_.Exception.Message -replace "`r?`n", " | "))"
            throw
          }

      - name: Build DSH-Plugin-Pulse
        shell: pwsh
        run: |
          try { ./tools/build/build-binaries.ps1 -Only pulse -PythonExe python }
          catch {
            Write-Host "::error title=DSH-Plugin-Pulse 构建失败::$(($_.Exception.Message -replace "`r?`n", " | "))"
            throw
          }

      - name: Checksums
        shell: pwsh
        run: |
          try { ./tools/build/build-binaries.ps1 -Only checksum }
          catch {
            Write-Host "::error title=产物校验失败::$(($_.Exception.Message -replace "`r?`n", " | "))"
            throw
          }

      - name: Show checksums
        shell: pwsh
        run: |
          Get-Content dist-bin/SHA256SUMS.txt
          "## Build binaries ($($env:GITHUB_REF_NAME))" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content dist-bin/SHA256SUMS.txt | ForEach-Object { "- ``$_``" } | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ github.ref_name }}
          path: dist-bin/
          if-no-files-found: error
